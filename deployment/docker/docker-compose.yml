version: '3.8'

services:
  # 🎭 Hermes - Frontend & API Gateway
  hermes:
    build:
      context: ../../
      dockerfile: deployment/docker/hermes.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - ENV=development
      - THESAURUS_URL=http://thesaurus:8001
      - SOPHIA_URL=http://sophia:8002
      - LOGOS_URL=http://logos:8003
    depends_on:
      - thesaurus
      - sophia
      - logos
    volumes:
      - ../../services/hermes/frontend:/app/frontend
    networks:
      - localfinance

  # 🏛️ Thesaurus - CRUD/Database Service
  thesaurus:
    build:
      context: ../../
      dockerfile: deployment/docker/thesaurus.Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=localfinance
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - localfinance

  # 🦉 Sophia - AI Service  
  sophia:
    build:
      context: ../../
      dockerfile: deployment/docker/sophia.Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ENV=development
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=llama3.2:1b
      - THESAURUS_URL=http://thesaurus:8001
    depends_on:
      - ollama
      - thesaurus
    networks:
      - localfinance

  # 📜 Logos - Document Processing Service
  logos:
    build:
      context: ../../
      dockerfile: deployment/docker/logos.Dockerfile
    ports:
      - "8003:8003"
    environment:
      - ENV=development
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=documents
      - THESAURUS_URL=http://thesaurus:8001
      - SOPHIA_URL=http://sophia:8002
    depends_on:
      - minio
      - thesaurus
      - sophia
    networks:
      - localfinance

  # 🗄️ PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: localfinance
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - localfinance

  # 🔴 Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"  
    networks:
      - localfinance

  # 🤖 Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    command: >
      bash -c "ollama serve &
      sleep 5 &&
      ollama pull llama3.2:1b &&
      wait"
    networks:
      - localfinance

  # 📁 MinIO Object Storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - localfinance

  # 📊 Grafana Monitoring (Optional)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - localfinance

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  minio_data:
  grafana_data:

networks:
  localfinance:
    driver: bridge