# LocalFinance - Full Local Dev Stack
# Usage: make dev-up / make dev-down

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: localfinance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Ollama is NOT bundled in Docker — services connect to the host's local
  # Ollama (brew install ollama) via host.docker.internal:11434. This avoids
  # a duplicate model install and lets the user manage models with `ollama pull`.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: devpassword
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Application Services
  hermes:
    build:
      context: .
      dockerfile: services/hermes/Dockerfile
    env_file: deployment/docker/dev.env
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

  # thesaurus container now runs the consolidated localfinance binary
  # (cmd/localfinance) — same hostname so other services keep working,
  # but the process inside is the unified server. Kept on port 8001
  # externally for compatibility; container listens on 3001.
  thesaurus:
    build:
      context: .
      dockerfile: Dockerfile.mono
    env_file: deployment/docker/dev.env
    ports:
      - "3001:3001"
      - "8001:3001"
    environment:
      PORT: "3001"
    volumes:
      - uploads_data:/tmp/localfinance
    depends_on:
      postgres:
        condition: service_healthy

  # sophia, logos, iris retired in Phase 1.5 — chat/insights/parse/webui are
  # all served by the consolidated thesaurus container.

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:

networks:
  default:
    name: localfinance-net
