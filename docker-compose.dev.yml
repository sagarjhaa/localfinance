# LocalFinance - Full Local Dev Stack
# Usage: make dev-up / make dev-down

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: localfinance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "llama3.2:1b"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    restart: "no"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: devpassword
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Application Services
  hermes:
    build:
      context: .
      dockerfile: services/hermes/Dockerfile
    env_file: deployment/docker/dev.env
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

  thesaurus:
    build:
      context: .
      dockerfile: services/thesaurus/Dockerfile
    env_file: deployment/docker/dev.env
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sophia:
    build:
      context: .
      dockerfile: services/sophia/Dockerfile
    env_file: deployment/docker/dev.env
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
    depends_on:
      thesaurus:
        condition: service_healthy
      ollama:
        condition: service_healthy

  logos:
    build:
      context: .
      dockerfile: services/logos/Dockerfile
    env_file: deployment/docker/dev.env
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
    depends_on:
      thesaurus:
        condition: service_healthy
      minio:
        condition: service_healthy

  iris:
    build:
      context: .
      dockerfile: services/iris/Dockerfile
    env_file: deployment/docker/dev.env
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    depends_on:
      thesaurus:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  minio_data:

networks:
  default:
    name: localfinance-net
